<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nestwell</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container { max-width: 400px; margin: 5rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .auth-container h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--primary);">
                <img src="../images/logo.jpeg" alt="Nestwell Logo" class="nav-logo">
                Nestwell
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="confirm-btn" style="background:var(--primary); margin-top: 1rem;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
            Don't have an account? <a href="register.html" style="color: var(--secondary);">Register here</a>
        </p>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Nestwell</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container { max-width: 450px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .auth-container h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--primary);">
                <img src="../images/logo.jpeg" alt="Nestwell Logo" class="nav-logo">
                Nestwell
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="Create a strong password">
            </div>
            <div class="form-group">
                <label>I am a...</label>
                <select id="regRole" required>
                    <option value="parent">Parent looking for care</option>
                    <option value="caretaker">Caretaker offering services</option>
                </select>
            </div>
            <button type="submit" class="confirm-btn" style="background:var(--secondary); margin-top: 1rem;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--primary);">Login here</a>
        </p>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Nestwell</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <h2>
                <img src="../../images/logo.jpeg" alt="Logo" style="height:30px; width:30px; border-radius:50%;">
                Nestwell
            </h2>
            <a href="dashboard.html">Overview</a>
            <a href="availability.html">My Availability</a>
            <a href="profile.html" class="active">My Profile</a>
            <a href="../../frontened/index.html" class="logout-btn">Logout</a>
        </aside>

        <main class="main-content">
            <h1>My Professional Profile</h1>
            
            <div style="background: white; padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--shadow); max-width: 750px;">
                
                <!-- Profile Header -->
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1.5rem;">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary);">
                    <div>
                        <h2 style="color: var(--primary); margin-bottom: 5px;">Dechen Wangmo</h2>
                        <!-- Using your icons.jpeg for the verified badge -->
                        <span class="verified-badge" style="font-size: 0.9rem; padding: 5px 12px;">
                            <img src="../../images/icons.jpeg" alt="Verified">
                            Verified Caretaker
                        </span>
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); alert('Profile updated successfully!');">
                    <div class="form-group">
                        <label>Professional Bio</label>
                        <textarea rows="3" placeholder="Tell parents about yourself...">Experienced caretaker with a background in early childhood education. I love working with toddlers and creating fun, educational activities!</textarea>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Hourly Rate (Nu.)</label>
                            <input type="number" value="150" required>
                        </div>
                        <div class="form-group">
                            <label>Years of Experience</label>
                            <input type="number" value="5" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Location / City</label>
                        <input type="text" value="Thimphu" required>
                    </div>

                    <div class="form-group" style="margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
                        <label>Upload Certificates / Documents (PDF, JPG)</label>
                        <input type="file" style="border: 1px dashed var(--primary); padding: 10px; background: #f9fbfc; cursor: pointer;">
                        <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 5px;">Uploading new documents will require Admin re-verification before they appear on your public profile.</p>
                    </div>

                    <button type="submit" class="confirm-btn" style="background: var(--primary); margin-top: 1rem; width: auto; padding: 12px 30px;">Update Profile</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>

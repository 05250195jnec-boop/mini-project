<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Care Notes - Nestwell</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <h2>
                <img src="../../images/logo.jpeg" alt="Logo" style="height:30px; width:30px; border-radius:50%;">
                Nestwell
            </h2>
            <a href="dashboard.html">Overview</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="profile.html" class="active">Child Care Notes</a>
            <a href="../../frontened/index.html" class="logout-btn">Logout</a>
        </aside>

        <main class="main-content">
            <h1>Manage Profile & Notes</h1>
            
            <div style="background: white; padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--shadow); max-width: 700px;">
                <form onsubmit="event.preventDefault(); alert('Profile and Care Notes saved successfully!');">
                    
                    <h2 style="color: var(--primary); margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 1px solid #eee; padding-bottom: 10px;">Personal Information</h2>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" value="john@example.com" required>
                        </div>
                    </div>

                    <h2 style="color: var(--primary); margin: 2rem 0 1rem 0; font-size: 1.2rem; border-bottom: 1px solid #eee; padding-bottom: 10px;">Child's Care Notes</h2>
                    
                    <div class="form-group">
                        <label>Child's Name & Age</label>
                        <input type="text" value="Leo Doe (3 years old)" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Allergies / Medical Conditions</label>
                        <textarea rows="3" placeholder="E.g., Peanuts, Penicillin, Asthma...">Peanut allergy. Carries an EpiPen in his backpack.</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Daily Routine & Special Needs</label>
                        <textarea rows="4" placeholder="E.g., Nap time, dietary restrictions...">Naps at 1:00 PM sharp. Prefers reading books before nap time. Needs to be reminded to use the bathroom every 2 hours.</textarea>
                    </div>

                    <button type="submit" class="confirm-btn" style="background: var(--primary); margin-top: 1rem; width: auto; padding: 12px 30px;">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
